<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SJ Personaliz.">
<title>Personalizados</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="marca.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: app de celular, cabeçalho fixo verde + lista de cartões + barra de abas embaixo */
:root {
  --bg: #f3f6f4;
  --surface: #ffffff;
  --surface-2: #e9efeb;
  --fg: #16201b;
  --muted: #5b6b62;
  --line: #d5dfd9;
  --brand: #009b52;
  --brand-ink: #ffffff;
  --brand-soft: #dff3e8;
  --late: #c8312b;
  --late-soft: #fbe5e3;
  --warn: #a86a00;
  --warn-soft: #fff1d6;
  --info: #1f63b8;
  --info-soft: #e1ecfa;
  --ok: #00824a;
  --ok-soft: #dcf2e5;
  --gray-soft: #e7eae8;
  --shadow: 0 1px 2px rgba(10, 40, 25, .06), 0 4px 14px rgba(10, 40, 25, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) and (max-width:0px) {
  :root:not([data-theme="light"]) {
    --bg: #0f1512; --surface: #18201c; --surface-2: #212b26; --fg: #e8efeb; --muted: #9db0a5; --line: #2d3a33;
    --brand: #1fb76a; --brand-ink: #04170d; --brand-soft: #173a28; --late: #ff7a72; --late-soft: #3d1d1b;
    --warn: #f0b44c; --warn-soft: #3a2c12; --info: #79aef0; --info-soft: #182b42; --ok: #4fd18f; --ok-soft: #173a28;
    --gray-soft: #26302b; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1512; --surface: #18201c; --surface-2: #212b26; --fg: #e8efeb; --muted: #9db0a5; --line: #2d3a33;
  --brand: #1fb76a; --brand-ink: #04170d; --brand-soft: #173a28; --late: #ff7a72; --late-soft: #3d1d1b;
  --warn: #f0b44c; --warn-soft: #3a2c12; --info: #79aef0; --info-soft: #182b42; --ok: #4fd18f; --ok-soft: #173a28;
  --gray-soft: #26302b; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 760px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }

/* faixa de aviso (My Manager / internet) */
.demo { background: var(--warn-soft); color: var(--warn); font-size: 12.5px; font-weight: 600; }
.demo .wrap { padding-block: 6px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.demo button { background: none; border: 0; color: inherit; text-decoration: underline; font-weight: 600; padding: 2px 0; }

/* login */
.login { min-height: 100%; display: flex; flex-direction: column; }
.login-top { background: var(--brand); color: var(--brand-ink); }
.login-top .wrap { padding-block: 28px 24px; display: grid; gap: 6px; }
.login-top h1 { font-size: 30px; }
.login-top p { margin: 0; opacity: .9; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding-block: 18px; }
.person { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: left; display: grid; gap: 2px; }
.person b { font-size: 16px; }
.person small { color: var(--muted); }
.person.sel { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand); }
.pinbox { display: grid; gap: 12px; justify-items: center; padding-block: 6px 24px; }
.dots { display: flex; gap: 12px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); }
.dots i.on { background: var(--brand); border-color: var(--brand); }
.keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; }
.keypad button { height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; font-weight: 600; }
.hint { color: var(--muted); font-size: 13px; text-align: center; }
.err { color: var(--late); font-weight: 600; font-size: 14px; min-height: 20px; }

/* casca do app */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--brand); color: var(--brand-ink); }
.top .wrap { padding-block: 12px; display: flex; align-items: center; gap: 10px; }
.top h1 { font-size: 20px; flex: 1; min-width: 0; }
.top .who { font-size: 12.5px; opacity: .9; font-family: var(--f-body); font-weight: 500; display: block; }
.iconbtn { position: relative; background: rgba(255,255,255,.16); border: 0; color: inherit; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 21px; height: 21px; }
.badge { position: absolute; top: -4px; right: -4px; background: var(--late); color: #fff; border-radius: 10px; font-size: 11px; font-weight: 700; min-width: 19px; height: 19px; display: grid; place-items: center; padding: 0 4px; }
main { padding-block: 14px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav .in { display: flex; max-width: 760px; margin: 0 auto; }
.nav button { flex: 1; background: none; border: 0; padding: 8px 2px 9px; display: grid; justify-items: center; gap: 2px; color: var(--muted); font-size: 11.5px; font-weight: 600; }
.nav button svg { width: 23px; height: 23px; }
.nav button.on { color: var(--brand); }

/* elementos */
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.section-title h2 { font-size: 22px; }
.section-title span { color: var(--muted); font-size: 13px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.list { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; text-align: left; width: 100%; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.card.mine { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), var(--shadow); }
.card.late::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--late); }
.card .row { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.card .cli { font-weight: 700; font-size: 16px; min-width: 0; }
.card .desc { color: var(--fg); min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 13px; }
.meta b { color: var(--fg); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.st-recebida { background: var(--info-soft); color: var(--info); }
.st-producao { background: var(--warn-soft); color: var(--warn); }
.st-pronta { background: var(--ok-soft); color: var(--ok); }
.st-entregue { background: var(--gray-soft); color: var(--muted); }
.st-cancelada { background: var(--gray-soft); color: var(--muted); text-decoration: line-through; }
.tag-late { background: var(--late-soft); color: var(--late); }
.tag-mine { background: var(--brand-soft); color: var(--brand); }
.tag-int { background: var(--gray-soft); color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; display: grid; gap: 1px; text-align: left; }
.sum b { font-size: 22px; font-family: var(--f-display); }
.sum span { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.sum.on { border-color: var(--fg); }
@media (max-width: 420px) { .summary { grid-template-columns: repeat(2, 1fr); } }

/* formulários */
.form { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .lbl { font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 11px; min-width: 0; }
.field textarea { min-height: 70px; resize: vertical; }
.field small { color: var(--muted); font-size: 12.5px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 8px; padding: 8px 4px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.check { display: flex; gap: 10px; align-items: flex-start; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--brand); flex: none; }
.check span small { display: block; color: var(--muted); }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--brand); color: var(--brand-ink); }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.danger { background: var(--late-soft); color: var(--late); }
.btn.block { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1 1 140px; }
.photo-prev { display: flex; gap: 8px; flex-wrap: wrap; }
.photo-prev img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }

/* resultado do orçamento */
.result { background: var(--brand-soft); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.prices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.price { background: var(--surface); border-radius: 12px; padding: 10px 12px; display: grid; }
.price span { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.price b { font-family: var(--f-display); font-size: 26px; }
.breakdown { font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.breakdown div { display: flex; justify-content: space-between; gap: 10px; }
.note { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 9px 11px; }

/* folha de detalhe */
.sheet-bg { position: fixed; inset: 0; background: rgba(5, 20, 12, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 760px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .head { position: sticky; top: 0; background: var(--bg); z-index: 1; }
.sheet .head .wrap { padding-block: 14px 10px; display: flex; gap: 10px; align-items: flex-start; }
.sheet .head h2 { flex: 1; font-size: 21px; min-width: 0; }
.sheet .body { display: grid; gap: 12px; padding-block: 4px 22px; }
.kv { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
.kv div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.kv div:last-child { border-bottom: 0; }
.kv span { color: var(--muted); }
.kv b { text-align: right; font-weight: 600; min-width: 0; }
.timeline { display: grid; gap: 6px; font-size: 13.5px; }
.timeline div { display: flex; gap: 8px; color: var(--muted); }
.timeline div b { color: var(--fg); font-weight: 600; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.steps div { height: 6px; border-radius: 3px; background: var(--line); }
.steps div.on { background: var(--brand); }
.steps-l { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 11px; color: var(--muted); font-weight: 600; }

/* conferência */
.conf-group { display: grid; gap: 8px; }
.conf-group h3 { font-size: 16px; display: flex; gap: 8px; align-items: center; }
.conf-group h3 .pill { font-family: var(--f-body); }
.match { display: grid; gap: 4px; }
.vals { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.vals span { color: var(--muted); }
.vals b { color: var(--fg); }
.diff { color: var(--late); font-weight: 700; }

/* tabela de relatório */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 720px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--surface-2); }
td.r, th.r { text-align: right; }
tr.late td:first-child { box-shadow: inset 4px 0 0 var(--late); }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 90px 1fr 84px; gap: 8px; align-items: center; font-size: 13px; }
.bar .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--brand); border-radius: 5px; }
.bar b { text-align: right; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
/* ---- v2: kanban, botão +, menus ---- */
:root { --fab: #e72a30; --fab-ink: #ffffff; }
@media (prefers-color-scheme: dark) and (max-width:0px) { :root:not([data-theme="light"]) { --fab: #ff5a5f; --fab-ink: #2a0506; } }
:root[data-theme="dark"] { --fab: #ff5a5f; --fab-ink: #2a0506; }
.fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 25; width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--fab); color: var(--fab-ink); box-shadow: 0 6px 18px rgba(200, 30, 37, .35); display: grid; place-items: center; }
.fab svg { width: 30px; height: 30px; }
.menu-opts { display: grid; gap: 10px; }
.opt { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: left; display: grid; gap: 2px; }
.opt b { font-size: 16px; }
.opt small { color: var(--muted); }
.opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kanban-wrap { overflow-x: auto; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); scroll-snap-type: x mandatory; padding-bottom: 6px; }
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: min(78vw, 300px); gap: 12px; align-items: start; }
.col { background: var(--surface-2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; scroll-snap-align: start; }
.col h3 { font-size: 15px; display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; }
.col h3 span { font-family: var(--f-body); font-size: 12px; font-weight: 700; background: var(--surface); border-radius: 999px; padding: 2px 8px; color: var(--muted); }
.col .card { box-shadow: none; padding: 10px 12px; }
.col .card .cli { font-size: 14.5px; }
.col .empty { padding: 14px 6px; font-size: 13px; }
.f-orcamento { background: var(--surface-2); color: var(--muted); }
.f-iniciar { background: var(--info-soft); color: var(--info); }
.f-producao { background: var(--warn-soft); color: var(--warn); }
.f-concluido { background: var(--ok-soft); color: var(--ok); }
.f-entregue { background: var(--gray-soft); color: var(--muted); }
.f-cancelada { background: var(--gray-soft); color: var(--muted); text-decoration: line-through; }
.tag-re { background: var(--late-soft); color: var(--late); }
.locked { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--brand-soft); border-radius: 10px; padding: 10px 12px; }
.locked b { font-family: var(--f-display); font-size: 20px; }
.itens { display: grid; gap: 4px; font-size: 13.5px; }
.itens div { display: flex; justify-content: space-between; gap: 10px; }
.itens .ref { color: var(--muted); font-size: 12px; }
.agenda-day { display: grid; gap: 8px; }
.agenda-day h3 { font-size: 15px; color: var(--muted); font-family: var(--f-body); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.ag { display: grid; grid-template-columns: 6px 1fr; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 0; overflow: hidden; text-align: left; width: 100%; }
.ag i { border-radius: 0 4px 4px 0; }
.ag .t { display: grid; gap: 2px; min-width: 0; }
.ag small { color: var(--muted); }
.req { color: var(--late); font-weight: 700; }
.hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
/* ---- v3: itens, quadro da agenda ---- */
.item-ed { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; background: var(--bg); }
.item-ed .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.item-ed .row b { font-size: 14px; }
.linkbtn { background: none; border: 0; color: var(--late); font-weight: 700; font-size: 13px; padding: 4px 0; }
.addbtn { border: 1.5px dashed var(--brand); background: var(--brand-soft); color: var(--brand); border-radius: 12px; padding: 12px; font-weight: 700; }
.kc { display: grid; gap: 3px; font-size: 13.5px; }
.kc .cli { font-size: 15.5px; font-weight: 700; }
.kc .prod { color: var(--fg); }
.kc .lin { color: var(--muted); }
.kc .lin b { color: var(--fg); font-weight: 600; }
.kc .late-d { color: var(--late); font-weight: 700; }
.it-st { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; margin-left: 6px; white-space: nowrap; }
.dem-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
.dem-item .row { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.dem-item .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.dem-item .acts .btn { padding: 9px 12px; font-size: 13.5px; flex: 1 1 120px; }
.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.weeknav b { font-family: var(--f-display); font-size: 17px; }
.weeknav button { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; width: 40px; height: 40px; display: grid; place-items: center; }
.weeknav button svg { width: 20px; height: 20px; }
.board-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.board { border-collapse: separate; border-spacing: 0; min-width: 760px; width: 100%; font-size: 12.5px; }

const ROUND1 = (x) => Math.ceil(x * 10 - 1e-9) / 10;
function calcImpressao(q) {
  const m = IMP_MAT.find((x) => x[0] === q.material) || IMP_MAT[0];
  const [uso, tempo, tinta] = IMP_PASS[q.passadas] || IMP_PASS[4];
  const area = q.largura * q.comprimento, areaMat = m[1] * (q.comprimento + 0.3);
  const custo = areaMat * m[2] + uso + area * m[2] * tempo + tinta * area * (q.pct / 100) + (q.arte || 0) + (q.fora || 0);
  return { cf: ROUND1(custo * 1.6), rev: ROUND1(custo * 1.1) };
}
function areaCaixa(c) {
  const L = c.cl / 100, C = c.cc / 100, A = c.ca / 100, tL = c.tl / 100, tC = c.tc / 100, tA = c.ta / 100;
  return (L * C + tL * tC + (2 * L + 2 * C) * A + (2 * tL + 2 * tC) * tA + L * c.dl * 0.05 + C * c.dc * 0.05) * 1.11112;

function calcLaser(q) {
  const m = LAS_MAT.find((x) => x[0] === q.material) || LAS_MAT[0];
  const [uso, prog, mont, taxa, cola] = LAS_TIPO[q.tipo][m[2]];
  const custo = q.m2 * m[1] * (1 + uso + prog + mont) + q.minutos + taxa + cola;
  return { cf: ROUND1(custo * 1.9), rev: ROUND1(custo * 1.2) };
}
function calcBordado(q) { const conta = ROUND1((q.pontos / 1000) * S.precos.bordadoMil * q.qtd), min = S.precos.bordadoMin ?? 20, v = Math.max(conta, min); return { cf: v, rev: v, minimo: conta < min, conta }; }

const GRAV_PADRAO = { simples: 20, simbolo: 25, arte: 30, lado2: 10, faca: 10, caneta: 5, lapis: 2 };
// Fotos: no app final vão para "Drive Personalizados/Fotos/<tipo>" com o nome "AAAA-MM-DD - cliente - produto.jpg"

function pastaDe(servico) { return "Fotos/" + ({ "Gravação UV": "Gravação" }[servico] || servico); }
function limpaNome(t) { return String(t).replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 60); }
function nomeFoto(d, produto, pasta) {
  const base = diaISO(HOJE) + " - " + limpaNome(d.cliente) + " - " + limpaNome(produto);
  const usados = S.dem.flatMap((x) => x.itens.flatMap((i) => i.fotoFinal).concat(x.fotoEntrega)).filter((f) => f && f.pasta === pasta && (f.nome === base + ".jpg" || f.nome.startsWith(base + " (")));

// ===================== Pessoas e serviços =====================
let PESSOAS = []; // vem do Supabase: { id, nome, papel, codVend }
let MMV = {}; // vendedores do My Manager: código -> nome
const DESC_PAPEL = { admin: "Administradora e vendas", pers: "Personalizados", vend: "Vendedora", inativo: "Sem acesso" };
const pessoa = (id) => PESSOAS.find((p) => p.id === id);
function pessoaDoVend(cod) {
  const p1 = PESSOAS.find((p) => p.papel !== "inativo" && p.codVend === +cod); if (p1) return p1;
  const n = norm(MMV[cod] || "").split(" ")[0]; if (!n) return null;
  return PESSOAS.find((p) => p.papel !== "inativo" && p.codVend == null && norm(p.nome).split(" ")[0] === n) || null;
}
const chaveVend = (cod) => { const p = pessoaDoVend(cod); return p ? p.id : "mm:" + cod; };
const nomeDe = (id) => { if (!id) return "—"; const p = pessoa(id); if (p) return p.nome; if (String(id).startsWith("mm:")) return titulo(MMV[id.slice(3)] || "Vendedor " + id.slice(3)); return String(id); };
const temLogin = (id) => { const p = pessoa(id); return !!p && p.papel !== "inativo"; };
const daCasa = (vend) => { const p = pessoa(vend); return !p || p.papel !== "vend"; };
const adminId = () => (PESSOAS.find((p) => p.papel === "admin") || {}).id;
function vendedoresLista(atual) {
  const l = PESSOAS.filter((p) => p.papel !== "inativo").map((p) => ({ id: p.id, nome: p.nome, login: true }));
  Object.keys(MMV).forEach((c) => { const k = "mm:" + c; if (!pessoaDoVend(c) && (S.vendas.some((v) => v.vend === k) || atual === k)) l.push({ id: k, nome: titulo(MMV[c]), login: false }); });
  if (atual && !l.some((x) => x.id === atual)) l.push({ id: atual, nome: nomeDe(atual), login: false });

}
const SERVICOS = ["Corte a laser", "Gravação UV", "Bordado", "Impressão"];
const SERV = { "170100": "Corte a laser", "170101": "Corte a laser", "170102": "Gravação UV", "170103": "Bordado", "170104": "Impressão" };
const REFS = Object.keys(SERV);

const ORD = FASES.map((f) => f[0]);
const faseNome = (f) => (f === "cancelada" ? "Cancelada" : (FASES.find((x) => x[0] === f) || [f, f])[1]);
const ITEM_F = { iniciar: "A iniciar", producao: "Em produção", concluido: "Pronto" };

// ===================== Datas e formatação =====================
const HOJE = new Date(); HOJE.setHours(0, 0, 0, 0);
const diaISO = (d) => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const somaDias = (n, base) => { const d = new Date(base || HOJE); d.setDate(d.getDate() + n); return diaISO(d); };
const dataBR = (iso) => { if (!iso) return "—"; const [y, m, d] = iso.split("-"); return d + "/" + m + (y != String(HOJE.getFullYear()) ? "/" + y.slice(2) : ""); };
const brl = (v) => (v == null || v === "" ? "—" : "R$ " + Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const norm = (s) => String(s || "").trim().toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

const CHAVE = "sb_publishable_9dtWhE4a9VyB1mZqLIlxvA_KlQ-unTB";

class ErroApp extends Error {}
async function rpc(fn, args, tempo) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), tempo || 20000);

// Monta as listas da tela a partir dos documentos da nuvem

  const info = docs.find((x) => x.col === "mm" && x.id === "info");

  S.dem = docs.filter((x) => x.col === "dem").map((x) => Object.assign({ status: null, contato: "", obs: "", interno: false, venda: null, orc: null, fotoEntrega: [], entregueEm: null, retrabalhos: [], hist: [], itens: [] }, clone(x.data), { id: +x.id, _v: x.v }))

function lerFoto(file, cb) {
  if (!file) return; const r = new FileReader();
  const tam = (img, m, q) => { const k = Math.min(1, m / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", q); };
  r.onload = () => { const img = new Image(); img.onload = () => cb({ u: tam(img, 1400, 0.8), t: tam(img, 220, 0.6) }); img.onerror = () => toast("Não deu para abrir essa foto. Tente outra."); img.src = r.result; };
  r.readAsDataURL(file);
}

    '<div class="kc">' + d.itens.map((i) => '<span class="prod">' + esc(i.desc) + (d.itens.length > 1 && ["iniciar", "producao", "concluido"].includes(F) ? stItem(i.fase) : "") + "</span>").join("") + "</div>" +

// ===================== Demandas =====================
function telaDemandas() {
  const vivas = S.dem.filter((d) => !["cancelada", "orcamento"].includes(d.status));
  const filtros = [["todas", "Todas"], ["abertas", "Em aberto"]];
  if (!casa()) filtros.push(["minhas", "Minhas"]); else filtros.push(["atrasadas", "Atrasadas"]);
  filtros.push(["prontas", "Prontas"], ["entregues", "Entregues"]);
  let l = vivas.slice();
  if (filtro === "minhas") l = l.filter(minha);
  if (filtro === "abertas") l = l.filter((d) => ["iniciar", "producao"].includes(fase(d)));
  if (filtro === "atrasadas") l = l.filter(atrasada);
  if (filtro === "prontas") l = l.filter((d) => fase(d) === "concluido");
  if (filtro === "entregues") l = l.filter((d) => fase(d) === "entregue");
  if (busca) { const b = norm(busca); l = l.filter((d) => norm(d.cliente + " " + d.itens.map((i) => i.desc).join(" ") + " " + nomeDe(d.vend)).includes(b)); }
  l.sort((a, b) => (casa() ? atrasada(b) - atrasada(a) : 0) || ORD.indexOf(fase(a)) - ORD.indexOf(fase(b)) || (a.prazo || "").localeCompare(b.prazo || ""));
  const n = (fn) => vivas.filter(fn).length;
  const tiles = [["abertas", "Em aberto", n((d) => ["iniciar", "producao"].includes(fase(d)))], casa() ? ["atrasadas", "Atrasadas", n(atrasada)] : ["minhas", "Minhas", n((d) => minha(d) && fase(d) !== "entregue")], ["prontas", "Prontas", n((d) => fase(d) === "concluido")], ["entregues", "Entregues", n((d) => fase(d) === "entregue")]];
  $("#main").innerHTML = '<div class="summary">' + tiles.map(([k, t, c]) => '<button type="button" class="sum' + (filtro === k ? " on" : "") + '" data-f="' + k + '"><b class="num"' + (k === "atrasadas" && c ? ' style="color:var(--late)"' : "") + ">" + c + "</b><span>" + t + "</span></button>").join("") + "</div>" +
    '<input class="search" id="busca" type="search" placeholder="Buscar cliente, produto ou vendedor" value="' + esc(busca) + '">' +
    '<div class="chips">' + filtros.map(([k, t]) => '<button type="button" class="chip' + (filtro === k ? " on" : "") + '" data-f="' + k + '">' + t + "</button>").join("") + "</div>" +
    '<div class="list">' + (l.length ? l.map(cardDem).join("") : '<div class="empty">Nenhuma demanda neste filtro.</div>') + "</div>";
  document.querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => { filtro = b.dataset.f; telaDemandas(); }));
  document.querySelectorAll("[data-d]").forEach((b) => (b.onclick = () => abrirDem(+b.dataset.d)));
  $("#busca").oninput = (e) => { busca = e.target.value; const p = e.target.selectionStart; telaDemandas(); const i = $("#busca"); i.focus(); try { i.setSelectionRange(p, p); } catch (er) {} };
}

// ===================== Acompanhamento (quadro) =====================
function telaAcomp() {
  const lim = somaDias(-7);
  const cols = FASES.map(([k, t]) => {
    let l = S.dem.filter((d) => fase(d) === k);
    let extra = "";
    if (k === "entregue") { const tot = l.length; l = l.filter((d) => (d.entregueEm || "") >= lim).sort((a, b) => (b.entregueEm || "").localeCompare(a.entregueEm || "")); extra = '<button type="button" class="btn ghost block" id="buscaEnt">Buscar entregues' + (tot > l.length ? " (" + (tot - l.length) + " mais antigos)" : "") + "</button>"; }
    else l.sort((a, b) => (a.prazo || "").localeCompare(b.prazo || ""));
    return '<div class="col"><h3>' + t + "<span>" + l.length + "</span></h3>" + (k === "entregue" ? '<small style="color:var(--muted);padding:0 4px">Últimos 7 dias, o mais novo em cima</small>' : "") + (l.length ? l.map((d) => cardQuadro(d)).join("") : '<div class="empty">Nada aqui.</div>') + extra + "</div>";
  }).join("");
  $("#main").innerHTML = '<div class="note">Arraste para o lado para ver todas as colunas. Toque num cartão para abrir e mudar de fase.</div><div class="kanban-wrap"><div class="kanban">' + cols + "</div></div>";
  document.querySelectorAll("[data-d]").forEach((b) => (b.onclick = () => abrirDem(+b.dataset.d)));
  $("#buscaEnt").onclick = buscarEntregues;
}
function buscarEntregues() {
  const el = sheet("Buscar entregues", '<input class="search" id="bE" type="search" placeholder="Nome do cliente"><div class="list" id="bL"></div>');
  const draw = () => {
    const b = norm($("#bE").value); const l = S.dem.filter((d) => fase(d) === "entregue" && (!b || norm(d.cliente).includes(b))).sort((x, y) => (y.entregueEm || "").localeCompare(x.entregueEm || ""));
    $("#bL").innerHTML = l.length ? l.map((d) => '<div class="card"><div class="kc"><span class="cli">' + esc(d.cliente) + "</span>" + d.itens.map((i) => '<span class="prod">' + esc(i.desc) + "</span>").join("") + '<span class="lin">Entregue em <b>' + dataBR(d.entregueEm) + "</b> · Vendedor <b>" + esc(nomeDe(d.vend)) + "</b></span></div>" +
      (d.itens.some((i) => i.fotoFinal.length) || d.fotoEntrega.length ? '<div class="photo-prev">' + d.itens.flatMap((i) => i.fotoFinal).concat(d.fotoEntrega).map((f) => '<img src="' + fu(f) + '" alt="Foto"' + (f.id ? ' data-fid="' + esc(f.id) + '"' : "") + (f.nome ? ' data-nome="' + esc(f.nome) + '" data-pasta="' + esc(f.pasta) + '"' : "") + ">").join("") + "</div>" : '<small style="color:var(--muted)">Sem foto no exemplo</small>') +
      '<div class="btns"><button type="button" class="btn ghost" data-ver="' + d.id + '">Abrir</button><button type="button" class="btn danger" data-re="' + d.id + '">Retrabalho</button></div></div>').join("") : '<div class="empty">Nenhum entregue com esse nome.</div>';
    el.querySelectorAll("[data-ver]").forEach((x) => (x.onclick = () => abrirDem(+x.dataset.ver)));
    el.querySelectorAll("[data-re]").forEach((x) => (x.onclick = () => abrirDem(+x.dataset.re, "retrabalho")));
  };
  $("#bE").oninput = draw; draw();
}

// ===================== Detalhe da demanda =====================
function abrirDem(id, abrirEm) {
  const d = S.dem.find((x) => x.id === id); if (!d) return;
  const F = fase(d), i = ORD.indexOf(F), v = d.venda ? S.vendas.find((x) => x.num === d.venda) : null;
  const fotos = (t, arr) => (arr && arr.length ? '<div class="photo-prev">' + arr.map((f) => '<img src="' + fu(f) + '" alt="' + t + '"' + (f.id ? ' data-fid="' + esc(f.id) + '"' : "") + (f.nome ? ' data-nome="' + esc(f.nome) + '" data-pasta="' + esc(f.pasta) + '"' : "") + ">").join("") + "</div>" + (arr.some((f) => f.nome) ? '<div class="ph-names">' + arr.filter((f) => f.nome).map((f) => "<span>Drive: <b>" + esc(f.pasta) + "</b> / " + esc(f.nome) + "</span>").join("") + "</div>" : "") : "");
  const itensHTML = d.itens.map((it, k) => '<div class="dem-item" data-ik="' + k + '"><div class="row"><span><b>' + esc(it.desc) + '</b><br><small style="color:var(--muted)">' + esc(it.servico) + (it.valor != null ? " · " + brl(it.valor) : it.orcCf != null ? " · orçado " + brl(it.orcCf) + (it.orcRev !== it.orcCf ? " (revenda " + brl(it.orcRev) + ")" : "") + (it.ajustado ? ", valor ajustado" : "") : "") + "</small></span>" + (["iniciar", "producao", "concluido"].includes(F) ? stItem(it.fase) : "") + "</div>" +
    fotos("Referência", it.anexos) + (it.fotoFinal.length ? '<small style="color:var(--muted)">Foto do produto pronto (toque para ampliar):</small>' + fotos("Produto pronto", it.fotoFinal) : "") +
    (casa() && ["iniciar", "producao", "concluido"].includes(F) ? '<div class="acts" id="ia' + k + '">' + (it.fase === "iniciar" ? '<button type="button" class="btn" data-ini="' + k + '">Começar produção</button>' : it.fase === "producao" ? '<button type="button" class="btn ghost" data-vol="' + k + '">Voltar para A iniciar</button><button type="button" class="btn" data-pro="' + k + '">Pronto (com foto)</button>' : '<button type="button" class="btn ghost" data-vol="' + k + '">Voltar para produção</button>') + "</div>" : "") + "</div>").join("");
  const el = sheet(esc(d.cliente),
    (F !== "cancelada" ? '<div><div class="steps" style="grid-template-columns:repeat(5,1fr)">' + ORD.map((p, k) => '<div class="' + (k <= i ? "on" : "") + '"></div>').join("") + '</div><div class="steps-l" style="grid-template-columns:repeat(5,1fr);margin-top:4px">' + ["Orçamento", "A iniciar", "Produção", "Pronto", "Entregue"].map((f) => "<span>" + f + "</span>").join("") + "</div></div>" : '<span class="pill f-cancelada">Cancelada</span>') +
    (casa() && atrasada(d) ? '<div class="note" style="background:var(--late-soft);color:var(--late);font-weight:600">Atrasada: a entrega era ' + dataBR(d.prazo) + ".</div>" : "") +
    (d.pedido && !d.orc ? '<div class="note" style="background:var(--warn-soft);color:var(--warn)"><b>Pedido de orçamento</b> de ' + esc(nomeDe(d.criadoPor)) + ". Responder até " + dataBR(d.prazo) + ".</div>" : "") +
    '<div class="lbl">' + (d.pedido && !d.orc ? "O que o cliente quer" : "Itens (" + d.itens.length + ")") + "</div>" + itensHTML +
    (d.pedidoItens ? '<details class="note"><summary>Pedido original de ' + esc(nomeDe(d.criadoPor)) + "</summary>" + d.pedidoItens.map((i) => esc(i.servico) + ": " + esc(i.desc)).join("<br>") + fotos("Referência", d.pedidoItens.flatMap((i) => i.anexos)) + "</details>" : "") +
    '<div class="kv"><div><span>Vendedor da nota</span><b>' + esc(nomeDe(d.vend)) + "</b></div>" + (d.contato ? "<div><span>Contato</span><b>" + esc(d.contato) + "</b></div>" : "") +
    "<div><span>Data do pedido</span><b>" + dataBR(d.data) + "</b></div><div><span>Entrega combinada</span><b>" + dataBR(d.prazo) + "</b></div>" + (d.entregueEm ? "<div><span>Entregue em</span><b>" + dataBR(d.entregueEm) + "</b></div>" : "") +
    (d.orc ? '<div><span>Orçamento nº ' + (d.orcId || d.id) + " · " + esc(d.orc.tipo) + '</span><b class="num">' + brl(d.orc.cf) + " · revenda " + brl(d.orc.rev) + "</b></div>" : "") +
    "<div><span>Venda no sistema</span><b>" + (d.interno ? "Serviço interno, não entra" : v ? v.num + " · " + brl(valorPers(v)) + " · " + (v.faturada ? "Faturada" : "Pré-venda") : F === "orcamento" ? "—" : '<span style="color:var(--warn)">Aguardando venda</span>') + "</b></div>" +
    (d.obs ? "<div><span>Observação</span><b>" + esc(d.obs) + "</b></div>" : "") + "</div>" +
    (d.fotoEntrega.length ? '<div class="lbl">Foto da entrega (toque para ampliar)</div>' + fotos("Entrega", d.fotoEntrega) : "") +
    (d.retrabalhos.length ? '<div class="note" style="background:var(--late-soft);color:var(--late)"><b>Retrabalho</b><br>' + d.retrabalhos.map((r) => dataBR(r[0]) + ": " + esc(r[1])).join("<br>") + "</div>" : "") +
    '<div id="acao" style="display:grid;gap:10px"></div>' +
    '<div class="lbl">Histórico</div><div class="timeline">' + d.hist.slice().reverse().map((h) => "<div><b>" + dataBR(h[0]) + "</b>" + esc(h[1]) + "</div>").join("") + "</div>");
  const acao = $("#acao");
  // ações por item
  el.querySelectorAll("[data-ini]").forEach((b) => (b.onclick = () => { const it = d.itens[+b.dataset.ini]; it.fase = "producao"; registra(d, "Produção iniciada: " + it.desc); }));
  el.querySelectorAll("[data-vol]").forEach((b) => (b.onclick = () => { const it = d.itens[+b.dataset.vol]; it.fase = it.fase === "concluido" ? "producao" : "iniciar"; registra(d, "Voltou para " + ITEM_F[it.fase] + ": " + it.desc); }));
  el.querySelectorAll("[data-pro]").forEach((b) => (b.onclick = () => { const k = +b.dataset.pro, it = d.itens[k]; pedirFoto($("#ia" + k), "Foto de " + it.desc, true, async (ft) => { const pasta = pastaDe(it.servico), nome = nomeFoto(d, it.desc, pasta); try { const id = await guardarFoto(ft, { pasta, nome, dem: d.id }); it.fotoFinal.push({ id, t: ft.t, nome, pasta }); } catch (er) { return erroGravar(er); } it.fase = "concluido"; registra(d, "Pronto com foto: " + it.desc); }, () => abrirDem(d.id)); }));
  const base = () => {
    let h = "";
    if (F === "orcamento" && !d.orc && casa()) h += '<button type="button" class="btn block" id="aFazOrc">Fazer o orçamento</button>';
    if (F === "orcamento" && d.orc) h += '<button type="button" class="btn block" id="aCli">Mandar para o cliente (WhatsApp ou PDF)</button>';
    if (F === "orcamento" && d.orc && (casa() || minha(d))) h += '<button type="button" class="btn ghost block" id="aLiga">Cliente fechou: ligar à venda do sistema</button>';
    if (casa() && ["iniciar", "producao"].includes(F)) h += '<div class="note"><b>Produção:</b> ' + (d.prodIni ? dataBR(d.prodIni) + (d.prodFim && d.prodFim !== d.prodIni ? " a " + dataBR(d.prodFim) : "") + " (" + diasEntre(d.prodIni, d.prodFim) + (diasEntre(d.prodIni, d.prodFim) > 1 ? " dias" : " dia") + ")" : '<span style="color:var(--warn)">ainda não programada</span>') + '</div><button type="button" class="btn ghost block" id="aProg">' + (d.prodIni ? "Mudar dias de produção" : "Programar produção") + "</button>";
    if (F === "concluido" && (casa() || minha(d))) h += '<button type="button" class="btn block" id="aEnt">Entregue ao cliente</button>';
    if (F === "entregue" && casa()) h += '<button type="button" class="btn danger block" id="aRe">Retrabalho: o cliente voltou</button><button type="button" class="btn ghost block" id="aDes">Desfazer entrega</button>';
    if (casa() && !["entregue", "cancelada"].includes(F)) h += '<div class="btns"><button type="button" class="btn ghost" id="aEdit">Editar</button><button type="button" class="btn danger" id="aCanc">Cancelar</button></div>';
    acao.innerHTML = h;
    if ($("#aFazOrc")) $("#aFazOrc").onclick = () => { const volta = tela; fecharSheet(); novoOrc(tipoDe(d.itens[0].servico), { cliente: d.cliente, vend: d.vend, prazo: d.prazo, pedidoId: d.id }); form = { voltar: volta }; tela = "orcar"; render(); window.scrollTo(0, 0); };
    if ($("#aCli")) $("#aCli").onclick = () => mandarCliente(d);
    if ($("#aLiga")) $("#aLiga").onclick = () => ligarVenda(d);
    if ($("#aProg")) $("#aProg").onclick = () => {
      const ini = d.prodIni || diaISO(HOJE), fim = d.prodFim || ini;
      acao.innerHTML = '<div class="form"><div class="lbl">Dias de produção</div>' + progCampos(ini, fim, !d.prodIni) + '<div class="btns"><button type="button" class="btn ghost" id="pgV">Voltar</button><button type="button" class="btn" id="pgO">Salvar</button></div></div>';
      const ler = ligaProg(d);
      $("#pgV").onclick = base;
      $("#pgO").onclick = () => { const r = ler(); if (!r) return; d.prodIni = r[0]; d.prodFim = r[1]; registra(d, "Produção de " + dataBR(r[0]) + " a " + dataBR(r[1]) + " (" + diasEntre(r[0], r[1]) + (diasEntre(r[0], r[1]) > 1 ? " dias" : " dia") + ")"); };
    };
    if ($("#aEnt")) $("#aEnt").onclick = () => pedirFoto(acao, "Foto da entrega", false, async (ft) => { if (ft) { const pasta = pastaDe(d.itens[0].servico), nome = nomeFoto(d, d.itens[0].desc + " - entrega", pasta); try { const id = await guardarFoto(ft, { pasta, nome, dem: d.id }); d.fotoEntrega.push({ id, t: ft.t, nome, pasta }); } catch (er) { return erroGravar(er); } } d.status = "entregue"; d.entregueEm = diaISO(HOJE); registra(d, "Entregue ao cliente"); }, base);
    if ($("#aRe")) $("#aRe").onclick = retrabalho;
    if ($("#aDes")) $("#aDes").onclick = () => { d.status = null; d.entregueEm = null; registra(d, "Entrega desfeita, voltou para Pronto para entregar"); };
    if ($("#aEdit")) $("#aEdit").onclick = () => { const volta = tela; fecharSheet(); form = Object.assign(JSON.parse(JSON.stringify(d)), { voltar: volta }); tela = "form"; render(); };
    if ($("#aCanc")) $("#aCanc").onclick = (e) => { const b = e.currentTarget; if (b.dataset.ok) { d.status = "cancelada"; return registra(d, "Cancelada"); } b.dataset.ok = "1"; b.textContent = "Toque de novo para confirmar"; };
  };
  function retrabalho() {
    acao.innerHTML = '<div class="form"><div class="lbl">Quais itens voltam para a produção?</div>' + d.itens.map((it, k) => '<label class="check"><input type="checkbox" data-rk="' + k + '"' + (d.itens.length === 1 ? " checked" : "") + "><span>" + esc(it.desc) + "</span></label>").join("") +
      '<div class="field"><label for="reM">O que precisa refazer?</label><input id="reM" placeholder="Ex.: gravação torta, trocar a cor"></div><div class="btns"><button type="button" class="btn ghost" id="reC">Voltar</button><button type="button" class="btn danger" id="reO">Voltar para produção</button></div></div>';
    $("#reC").onclick = base;
    $("#reO").onclick = () => {
      const ks = [...acao.querySelectorAll("[data-rk]")].filter((c) => c.checked).map((c) => +c.dataset.rk); if (!ks.length) return toast("Marque pelo menos um item.");
      const m = $("#reM").value.trim() || "sem descrição"; ks.forEach((k) => (d.itens[k].fase = "producao")); d.status = null; d.entregueEm = null; d.retrabalhos.push([diaISO(HOJE), m]); registra(d, "Retrabalho: " + m);
    };
  }
  base();
  if (abrirEm === "retrabalho" && F === "entregue") retrabalho();
  if (abrirEm === "entrega" && $("#aEnt")) $("#aEnt").click();
}
function pedirFoto(alvo, tit, obrig, ok, voltar) {
  alvo.innerHTML = '<div class="form" style="flex:1 1 100%"><div class="lbl">' + esc(tit) + (obrig ? ' <span class="req">obrigatória</span>' : " (opcional)") + '</div><small style="color:var(--muted)">A foto vai para o Drive, na pasta Fotos do tipo do item, com a data, o cliente e o produto no nome.</small><label class="btn ghost block" for="fx" style="text-align:center">Tirar ou escolher foto</label><input class="hidden-input" id="fx" type="file" accept="image/*" capture="environment"><div class="photo-prev" id="fxp"></div><div class="btns"><button type="button" class="btn ghost" id="fxc">Voltar</button><button type="button" class="btn" id="fxo"' + (obrig ? ' disabled style="opacity:.5"' : "") + ">Confirmar</button></div></div>";
  let url = null;
  $("#fx").onchange = (e) => lerFoto(e.target.files[0], (ft) => { url = ft; $("#fxp").innerHTML = '<img src="' + ft.t + '" alt="">'; const o = $("#fxo"); o.disabled = false; o.style.opacity = 1; });
  $("#fxc").onclick = voltar; $("#fxo").onclick = (e) => { if (e.currentTarget.dataset.ok) return; e.currentTarget.dataset.ok = "1"; e.currentTarget.textContent = "Salvando..."; ok(url); };
}
async function registra(d, txt) {
  d.hist.push([diaISO(HOJE), txt + " (" + U.nome + ")"]);
  const F = fase(d); let aviso = null, msg;
  if (F === "concluido" && txt.startsWith("Pronto")) {
    const adm = adminId();
    const para = temLogin(d.vend) && d.vend !== U.id ? d.vend : adm && d.vend !== adm && U.id !== adm ? adm : null;
    if (para) { aviso = { para, txt: d.cliente + ": " + d.itens.map((i) => i.desc).join(", ") + " está pronta para entregar.", dem: d.id, lido: false, quando: diaISO(HOJE) }; msg = "Todos os itens prontos. " + nomeDe(para) + " recebeu o aviso no app."; }
    else msg = "Todos os itens prontos.";
  } else if (txt.startsWith("Pronto")) msg = "Item pronto. Faltam " + d.itens.filter((i) => i.fase !== "concluido").length + " para avisar a vendedora.";
  else msg = txt + ".";
  try {
    await salvarDem(d);
    if (aviso) await gravarDoc("aviso", uid(), aviso);
    toast(msg);
  } catch (e) { erroGravar(e); }
  fecharSheet(); render();
}

// ===================== Orçamento para o cliente e ligação com a venda =====================
const tipoDe = (servico) => ({ "Impressão": "imp", "Corte a laser": "las", "Bordado": "bor", "Gravação UV": "grav" }[servico] || "las");
const diasEntre = (a, b) => Math.round((new Date((b || a) + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5) + 1;
function textoCliente(d, tab) {
  const val = (i) => (tab === "rev" ? i.orcRev : i.orcCf);
  const temItem = d.itens.every((i) => i.orcCf != null);
  const total = tab === "rev" ? d.orc.rev : d.orc.cf;
  return "*Loja São João · Personalizados*\nOrçamento nº " + d.id + " · " + dataBR(d.data) + (d.data.slice(0, 4) === String(HOJE.getFullYear()) ? "/" + HOJE.getFullYear() : "") + "\nCliente: " + d.cliente + "\n\n" +
    d.itens.map((i, k) => (k + 1) + ". " + i.desc + (temItem ? " · " + brl(val(i)) : "")).join("\n") +
    "\n\n*Total: " + brl(total) + "*" + (tab === "rev" ? " (preço de revenda)" : "") + "\n\nQualquer dúvida, estamos à disposição!\nAtendimento: " + nomeDe(d.vend);
}
function mandarCliente(d) {
  let tab = "cf";
  const el = sheet("Orçamento nº " + d.id + " para o cliente", '<div class="seg" id="mcTab"><button type="button" data-t="cf" class="on">Consumidor final</button><button type="button" data-t="rev">Revenda</button></div><textarea id="mcTxt" rows="12" style="width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--fg)"></textarea><small style="color:var(--muted)">Dá para mudar o texto antes de mandar.</small><div class="btns"><button type="button" class="btn ghost" id="mcCopia">Copiar texto</button><a class="btn" id="mcZap" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">Abrir no WhatsApp</a></div><button type="button" class="btn ghost block" id="mcPdf">Gerar PDF</button>');
  const pinta = () => { $("#mcTxt").value = textoCliente(d, tab); liga(); };
  const liga = () => { const fone = String(d.contato || "").replace(/\D/g, ""); $("#mcZap").href = "https://wa.me/" + (fone.length >= 10 ? (fone.startsWith("55") ? fone : "55" + fone) : "") + "?text=" + encodeURIComponent($("#mcTxt").value); };
  el.querySelectorAll("#mcTab [data-t]").forEach((b) => (b.onclick = () => { tab = b.dataset.t; el.querySelectorAll("#mcTab button").forEach((x) => x.classList.toggle("on", x === b)); pinta(); }));
  $("#mcTxt").oninput = liga;
  $("#mcCopia").onclick = async () => { const t = $("#mcTxt").value; try { await navigator.clipboard.writeText(t); toast("Texto copiado. É só colar no WhatsApp do cliente."); } catch (e) { $("#mcTxt").select(); document.execCommand("copy"); toast("Texto copiado."); } };
  $("#mcPdf").onclick = () => pdfOrcamento(d, tab);
  pinta();
}
function pdfOrcamento(d, tab) {
  const val = (i) => (tab === "rev" ? i.orcRev : i.orcCf), temItem = d.itens.every((i) => i.orcCf != null);
  let pg = $("#printOrc"); if (!pg) { pg = document.createElement("div"); pg.id = "printOrc"; document.body.appendChild(pg); }
  pg.innerHTML = '<div class="po"><div class="po-top"><b>Loja São João</b><span>Personalizados</span></div><h1>Orçamento nº ' + d.id + '</h1><p>Data: ' + dataBR(d.data) + "/" + d.data.slice(0, 4) + "<br>Cliente: <b>" + esc(d.cliente) + "</b>" + (tab === "rev" ? "<br>Preço de revenda" : "") + '</p><table><thead><tr><th>Item</th><th class="r">Valor</th></tr></thead><tbody>' +
    d.itens.map((i) => "<tr><td>" + esc(i.desc) + '<br><small>' + esc(i.servico) + '</small></td><td class="r">' + (temItem ? brl(val(i)) : "") + "</td></tr>").join("") +
    '</tbody><tfoot><tr><td>Total</td><td class="r">' + brl(tab === "rev" ? d.orc.rev : d.orc.cf) + "</td></tr></tfoot></table><p>Atendimento: " + esc(nomeDe(d.vend)) + "</p><p class=\"po-fim\">Qualquer dúvida, estamos à disposição!</p></div>";
  toast("Na janela que abrir, escolha \"Salvar como PDF\".");
  setTimeout(() => window.print(), 300);
}
function ligarVenda(d) {
  const l = S.vendas.filter((v) => valorPers(v) > 0 && !S.dem.some((x) => x.venda === v.num) && (casa() || v.vend === U.id))

  }

const SVC_COR = { "Orçamentos": "var(--muted)", "Corte a laser": "var(--brand)", "Gravação UV": "var(--late)", "Bordado": "var(--info)", "Impressão": "var(--warn)" };

function ligaProg(d) {
  const I = $("#pgI"), N = $("#pgN"), T = $("#pgF");

  const porDias = () => { const n = parseInt(N.value, 10); if (I.value && n >= 1) T.value = somaDias(n - 1, new Date(I.value + "T00:00:00")); msg(); };

  if (casa()) {
    const l = avisosAbertos();
    $("#main").innerHTML = '<div class="list">' + (l.length ? l.map((a) => { const d = S.dem.find((x) => x.id === a.dem); return d ? (a.tipo === "pedido" ? '<div class="lin" style="font-weight:600;color:var(--warn)">Pedido de orçamento</div>' : "") + cardQuadro(d, { av: S.avisos.indexOf(a), novo: !a.lido, quando: a.quando }) : ""; }).join("") : '<div class="empty">Nenhum aviso por enquanto.</div>') + "</div>";
    document.querySelectorAll("[data-av]").forEach((b) => (b.onclick = () => { const a = S.avisos[+b.dataset.av]; if (!a.lido) { a.lido = true; gravarDoc("aviso", a._id, avisoLimpo(a), a._v).catch(() => {}); } render(); abrirDem(a.dem); }));
    return;
  }
  const novo = (d, tipo) => S.avisos.find((a) => a.para === U.id && a.dem === d.id && !a.lido && (a.tipo || "pronto") === tipo);
  const prontos = S.dem.filter((d) => minha(d) && fase(d) === "concluido").sort((a, b) => (a.prazo || "").localeCompare(b.prazo || ""));
  const orcs = S.dem.filter((d) => minha(d) && d.status === "orcamento" && d.pedido && d.orc);
  const espera = S.dem.filter((d) => minha(d) && d.status === "orcamento" && d.pedido && !d.orc);
  const bloco = (d, tipo, botao) => { const a = novo(d, tipo); return '<div class="aviso-bloco">' + cardQuadro(d, a ? { av: S.avisos.indexOf(a), novo: true, quando: a.quando } : null) + botao + "</div>"; };
  $("#main").innerHTML = '<h2 class="aviso-tit">Prontos para entrega</h2><p class="aviso-sub">Tudo que já está pronto. Quando o cliente buscar, toque em <b>Entregue</b>.</p>' +
    '<div class="list">' + (prontos.length ? prontos.map((d) => bloco(d, "pronto", '<button type="button" class="btn block" data-ent="' + d.id + '">Entregue</button>')).join("") : '<div class="empty">Nada pronto para entregar agora.</div>') + "</div>" +
    (orcs.length ? '<h2 class="aviso-tit" style="font-size:22px;margin-top:10px">Orçamentos respondidos</h2><p class="aviso-sub">O Júnior respondeu. Mande para o cliente.</p><div class="list">' + orcs.map((d) => bloco(d, "orc", '<button type="button" class="btn ghost block" data-cli="' + d.id + '">Mandar para o cliente</button>')).join("") + "</div>" : "") +
    (espera.length ? '<div class="section-title"><h2>Esperando o Júnior</h2><span>' + espera.length + '</span></div><div class="list">' + espera.map((d) => cardQuadro(d)).join("") + "</div>" : "");
  const lido = (id) => S.avisos.forEach((a) => { if (a.para === U.id && a.dem === id) marcarLido(a); });
  document.querySelectorAll("[data-av]").forEach((b) => (b.onclick = () => { const a = S.avisos[+b.dataset.av]; lido(a.dem); render(); abrirDem(a.dem); }));
  document.querySelectorAll("#main [data-d]").forEach((b) => (b.onclick = () => abrirDem(+b.dataset.d)));
  document.querySelectorAll("[data-ent]").forEach((b) => (b.onclick = () => { lido(+b.dataset.ent); abrirDem(+b.dataset.ent, "entrega"); }));
  document.querySelectorAll("[data-cli]").forEach((b) => (b.onclick = () => { lido(+b.dataset.cli); render(); mandarCliente(S.dem.find((x) => x.id === +b.dataset.cli)); }));
}
function telaPessoas() {
  const papel = { admin: "Vê e altera tudo, cadastra pessoas, PINs e preços", pers: "Orçamentos, produção, vendas sem entrada, relatórios e agenda", vend: "Dá entrada nas próprias vendas e acompanha as demandas", inativo: "Não entra mais no app" };
  const mmOpts = (sel) => '<option value="">Achar pelo nome</option>' + Object.entries(MMV).sort((a, b) => a[1].localeCompare(b[1])).map(([c, n]) => '<option value="' + c + '"' + (+c === sel ? " selected" : "") + ">" + esc(titulo(n)) + " (" + c + ")</option>").join("");
  const papelOpts = (sel) => [["vend", "Vendedora"], ["pers", "Personalizados"], ["admin", "Administradora"], ["inativo", "Sem acesso"]].map(([k, t]) => '<option value="' + k + '"' + (k === sel ? " selected" : "") + ">" + t + "</option>").join("");
  const mmDe = (p) => { const c = p.codVend != null ? p.codVend : Object.keys(MMV).find((k) => { const x = pessoaDoVend(k); return x && x.id === p.id; }); return c != null && MMV[c] ? titulo(MMV[c]) + (p.codVend == null ? " (pelo nome)" : "") : "não achado"; };
  $("#main").innerHTML = '<div class="note">O vendedor do My Manager liga cada pessoa às vendas dela. Se aparecer "não achado", escolha o nome certo em Mudar.</div><div class="list">' +
    PESSOAS.map((p) => '<div class="card"><div class="row"><div class="cli">' + esc(p.nome) + '</div><span class="pill ' + (p.papel === "inativo" ? "tag-int" : p.papel === "vend" ? "f-iniciar" : "tag-mine") + '">' + esc(DESC_PAPEL[p.papel]) + '</span></div><div class="meta"><span>' + papel[p.papel] + "</span><span>My Manager: <b>" + esc(mmDe(p)) + "</b></span>" + (p.trocarPin ? '<span style="color:var(--warn)">Ainda não criou o PIN dela</span>' : "") + '</div><div class="btns"><button type="button" class="btn ghost" data-ed="' + p.id + '">Mudar</button></div></div>').join("") + "</div>" +
    '<form class="form" id="fPes" autocomplete="off"><div class="lbl">Nova pessoa</div><div class="grid2"><div class="field"><label for="pNome">Nome</label><input id="pNome" required></div><div class="field"><label for="pPapel">Papel</label><select id="pPapel">' + papelOpts("vend").replace(/<option value="inativo".*?<\/option>/, "") + '</select></div></div><div class="grid2"><div class="field"><label for="pPin">PIN inicial (4 números)</label><input id="pPin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required><small>No 1º acesso o app pede um PIN novo.</small></div><div class="field"><label for="pMM">Vendedor no My Manager</label><select id="pMM">' + mmOpts(null) + '</select></div></div><button class="btn" type="submit">Cadastrar</button></form>';
  $("#fPes").onsubmit = async (e) => {
    e.preventDefault();
    try { await rpc("pers_pessoa_salvar", { p_token: TOKEN, p_id: null, p_nome: $("#pNome").value, p_papel: $("#pPapel").value, p_cod_vend: $("#pMM").value ? +$("#pMM").value : null, p_pin: $("#pPin").value }); await sincronizar(); toast($("#pNome").value + " já pode entrar com o PIN."); telaPessoas(); }
    catch (er) { erroGravar(er); }
  };
  document.querySelectorAll("[data-ed]").forEach((b) => (b.onclick = () => {
    const p = pessoa(b.dataset.ed);
    const el = sheet("Mudar " + esc(p.nome), '<form class="form" id="fEd" autocomplete="off"><div class="field"><label for="eNome">Nome</label><input id="eNome" value="' + esc(p.nome) + '" required></div>' +
      (p.id === U.id ? "" : '<div class="field"><label for="ePapel">Papel</label><select id="ePapel">' + papelOpts(p.papel) + "</select></div>") +
      '<div class="field"><label for="eMM">Vendedor no My Manager</label><select id="eMM">' + mmOpts(p.codVend) + '</select></div><div class="field"><label for="ePin">PIN novo (deixe vazio para não mudar)</label><input id="ePin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}"><small>Se mudar, a pessoa cria outro PIN no próximo acesso.</small></div><button class="btn block" type="submit">Salvar</button></form>');
    $("#fEd").onsubmit = async (e) => {
      e.preventDefault();
      try { await rpc("pers_pessoa_salvar", { p_token: TOKEN, p_id: p.id, p_nome: $("#eNome").value, p_papel: $("#ePapel") ? $("#ePapel").value : p.papel, p_cod_vend: $("#eMM").value ? +$("#eMM").value : null, p_pin: $("#ePin").value || null }); await sincronizar(); fecharSheet(); toast("Salvo."); telaPessoas(); }
      catch (er) { erroGravar(er); }
    };
  }));
}
function telaPrecos() {
  const G = S.precos.grav;
  const LAB = [["simples", "Garrafa simples/nome"], ["simbolo", "Garrafa com símbolo que já temos"], ["arte", "Garrafa com arte nova"], ["lado2", "2º lado da garrafa (nome)"], ["faca", "Faca/canivete"], ["caneta", "Caneta"], ["lapis", "Lápis de cor (cada)"]];
  const pend = S.dem.filter((d) => d.orc && d.orc.planilha === false && d.status !== "cancelada");
  $("#main").innerHTML = '<div class="note">Só você vê e muda esta tela. Os preços de impressão e de corte a laser vêm das planilhas no Drive.</div>' +
    '<form class="form" id="fPr"><div class="lbl">Bordado</div><div class="grid2"><div class="field"><label for="prB">R$ por mil pontos</label><input id="prB" type="number" min="0" step="0.1" inputmode="decimal" value="' + S.precos.bordadoMil + '"></div><div class="field"><label for="prBm">Valor mínimo R$</label><input id="prBm" type="number" min="0" step="1" inputmode="decimal" value="' + (S.precos.bordadoMin ?? 20) + '"></div></div><small style="color:var(--muted)">O mínimo é para ligar a máquina: nenhum bordado sai por menos. As outras pessoas só veem o valor final.</small>' +
    '<div class="lbl">Gravação UV (R$ por unidade)</div><div class="grid2">' + LAB.map(([k, t]) => '<div class="field"><label for="pg_' + k + '">' + t + '</label><input id="pg_' + k + '" type="number" min="0" step="0.5" inputmode="decimal" value="' + G[k] + '"></div>').join("") + '</div><small style="color:var(--muted)">"Outro" não tem preço na tabela: quem faz o orçamento digita o valor.</small>' +
    '<button class="btn" type="submit">Salvar preços</button></form>' +
    '<form class="form" id="fGo" autocomplete="off"><div class="lbl">Ligação com o Google (planilhas e fotos no Drive)</div><div class="field"><label for="gUrl">Endereço do app do Google</label><input id="gUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="' + esc((S.google && S.google.url) || "") + '"><small>' + (S.google && S.google.url ? "Ligado." : "Ainda não ligado. Os orçamentos e as fotos ficam guardados no app e vão para o Drive depois.") + '</small></div><div class="btns"><button class="btn ghost" type="button" id="gTeste">Testar</button><button class="btn" type="submit">Salvar endereço</button></div>' +
    (pend.length ? '<div class="note" style="background:var(--warn-soft);color:var(--warn)">' + pend.length + (pend.length > 1 ? " orçamentos ainda não foram" : " orçamento ainda não foi") + ' para as planilhas.</div><button class="btn ghost" type="button" id="gPend">Mandar para as planilhas agora</button>' : "") + "</form>";
  $("#fPr").onsubmit = async (e) => {
    e.preventDefault(); const g = {}; LAB.forEach(([k]) => (g[k] = +$("#pg_" + k).value || 0));
    try { await gravarDoc("cfg", "precos", { bordadoMil: +$("#prB").value || 0, bordadoMin: +$("#prBm").value || 0, grav: g }); toast("Preços salvos. Os próximos orçamentos já usam os valores novos."); } catch (er) { erroGravar(er); }
  };
  const url = () => $("#gUrl").value.trim();
  $("#gTeste").onclick = async () => {
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(url())) return toast("Cole o endereço que termina em /exec.");
    const ant = S.google; S.google = { url: url() };
    try { const r = await enviarGoogle({ acao: "teste" }); toast("Funcionou! Pasta do Drive: " + (r.pasta || "ok") + "."); } catch (er) { toast("Não funcionou: " + er.message); } finally { S.google = ant; }
  };
  $("#fGo").onsubmit = async (e) => {
    e.preventDefault();
    if (url() && !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(url())) return toast("Cole o endereço que termina em /exec.");
    try { await gravarDoc("cfg", "google", { url: url() }); toast(url() ? "Endereço salvo. O app já manda orçamentos e fotos para o Google." : "Ligação com o Google desligada."); telaPrecos(); } catch (er) { erroGravar(er); }
  };
  if ($("#gPend")) $("#gPend").onclick = async (e) => {
    e.currentTarget.disabled = true; e.currentTarget.textContent = "Mandando...";
    let ok = 0; for (const d of pend) if (await orcParaPlanilha(d.id)) ok++;
    toast(ok + " de " + pend.length + " foram para as planilhas."); telaPrecos();
  };
}

// Foto em tela cheia: um toque abre, outro toque fecha
document.addEventListener("click", (e) => {
  const img = e.target.closest && e.target.closest(".photo-prev img"); if (!img || img.closest("#fxp")) return;
  e.stopPropagation();
  const v = document.createElement("div"); v.className = "viewer"; v.setAttribute("role", "dialog"); v.setAttribute("aria-label", "Foto ampliada");
  v.innerHTML = '<button type="button" aria-label="Fechar">' + ic("x") + '</button><img src="' + img.src + '" alt="' + esc(img.alt) + '">' + (img.dataset.nome ? "<p>" + esc(img.dataset.nome) + "<small>Drive Personalizados / " + esc(img.dataset.pasta) + "</small></p>" : "<p>" + esc(img.alt) + "</p>");
  const fecha = () => { v.remove(); document.removeEventListener("keydown", esc_); }; const esc_ = (k) => { if (k.key === "Escape") fecha(); };
  v.onclick = fecha; document.addEventListener("keydown", esc_); document.body.appendChild(v);
  if (img.dataset.fid) lerFotoGrande(img.dataset.fid).then((u) => { const g = v.querySelector("img"); if (u && g) g.src = u; }).catch(() => {});
}, true);

iniciar();
